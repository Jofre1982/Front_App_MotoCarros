[workspace]
resolver = "2"
members = ["crates/moto_core", "crates/moto_ui", "crates/web", "crates/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dioxus = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }

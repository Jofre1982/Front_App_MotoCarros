[workspace]
resolver = "2"
members = ["crates/moto_core", "crates/moto_ui", "crates/web", "crates/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dioxus = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "multipart", "rustls", "webpki-roots"] }
# Codifica la foto de un mandado (issue #78) como data URI para un `<img
# src>`: es la unica forma de mostrar un archivo autenticado (requiere
# Bearer token, no cookie) sin poder apuntar el `src` directo a la URL del
# backend. Version ya presente en el arbol de dependencias via `reqwest`, no
# agrega una nueva.
base64 = "0.22"
